<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Rare</title>
<meta name="description" content="A daily film trivia game. Name a movie that fits the clue before the timer runs out. The fewer people who'd think of it, the more it's worth.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --velvet:#4a0d1c;        /* house curtain */
  --velvet-deep:#22060d;   /* shadow in the folds */
  --beam:#fff1c9;          /* projector light */
  --board:#eef3f2;         /* lit letterboard */
  --slot:#cfd9d7;          /* letterboard grooves */
  --letter:#000;
  --bulb:#ffd27a;
  --text:#fbeee8;
  --text-dim:#d9b8b4;
  --t0:#7b5a5e; --t1:#d8d1c3; --t2:#7fb3e0; --t3:#b79cf0; --t4:#8fd19a; --t5:#ffcf4d;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--velvet-deep);color:var(--text);font:17px/1.55 var(--body);overflow-x:hidden}
#house{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
main{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:22px 16px 72px;transition:background-color .6s,box-shadow .6s}
/* while the curtains are open, keep the page readable against the lit screen */
body.lit main{background-color:rgba(26,6,11,.88);box-shadow:0 0 60px 20px rgba(26,6,11,.88)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{font:900 30px/1 var(--display);letter-spacing:.5px;color:var(--bulb);text-shadow:0 0 18px rgba(255,210,122,.55)}
.modes{display:flex;gap:4px}
.modes button{font:700 15px var(--body);color:var(--text-dim);background:none;border:0;padding:6px 10px;cursor:pointer;border-bottom:2px solid transparent}
.modes button[aria-pressed=true]{color:var(--text);border-bottom-color:var(--bulb)}

/* the letterboard */
.marquee{position:relative;background:#16080b;padding:16px 14px 14px;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 3px #2b1015}
.bulbs{display:flex;justify-content:space-between;padding:0 6px 12px}
.bulb{width:16px;height:16px;border-radius:50%;background:#4b2a2d;box-shadow:inset 0 -2px 3px rgba(0,0,0,.4)}
.bulb.now{background:var(--bulb);box-shadow:0 0 12px 3px rgba(255,210,122,.7);animation:blink 1.1s steps(2,jump-none) infinite}
.bulb.t0{background:var(--t0)}.bulb.t1{background:var(--t1)}.bulb.t2{background:var(--t2)}.bulb.t3{background:var(--t3)}.bulb.t4{background:var(--t4)}.bulb.t5{background:var(--t5);box-shadow:0 0 12px 2px rgba(255,207,77,.8)}
@keyframes blink{50%{opacity:.35}}
.board{background:var(--board);
  padding:6px 18px 8px;min-height:116px;display:flex;align-items:center;justify-content:center;text-align:center;
  box-shadow:inset 0 0 30px rgba(140,170,170,.35)}
.board p{margin:0;width:100%;background:repeating-linear-gradient(to bottom,transparent 0 45px,var(--slot) 45px 47px,transparent 47px 48px);font:700 37px/48px var(--display);text-transform:uppercase;letter-spacing:1.5px;color:var(--letter)}
.board.score p{font-size:80px;line-height:96px;background:none}
.caption{margin:12px 2px 0;color:var(--text-dim);font-size:15px;display:flex;justify-content:space-between;gap:10px}

/* clue timer: a strip of light draining under the board */
.timer{height:6px;margin-top:10px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden}
.timer span{display:block;height:100%;background:var(--bulb);transform-origin:left;transition:transform .2s linear}
.timer span.low{background:#ff7a5c}
.tried{margin:6px 0 0;color:var(--text-dim);font-size:15px}
/* answering */
form{margin-top:26px}
label.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.entry{display:flex;gap:10px}
.entry input{flex:1;min-width:0;font:20px var(--body);color:var(--text);background:rgba(0,0,0,.35);border:0;border-bottom:2px solid var(--text-dim);padding:12px 4px;outline:none;border-radius:0}
.entry input::placeholder{color:#b8918d}
.entry input:focus{border-bottom-color:var(--bulb)}
button.go{font:900 22px var(--display);letter-spacing:1px;background:var(--bulb);color:#2a0b10;border:0;padding:0 22px;border-radius:3px;cursor:pointer}
button.go:hover{background:#ffe0a1}
:focus-visible{outline:3px solid var(--beam);outline-offset:3px}
.status{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:15px;color:var(--text-dim)}
.linkish{background:none;border:0;color:var(--text-dim);font:15px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.linkish:hover{color:var(--text)}
.note{min-height:26px;margin-top:10px;color:#ffb3a7}
.ladder{list-style:none;padding:0;margin:26px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:13px;line-height:1.3;color:var(--text-dim)}
.ladder li{border-top:4px solid;padding-top:6px}
.ladder b{display:block;color:var(--text);font-size:14px}

/* the ticket stub (the one animated reveal) */
.ticket{position:relative;margin:26px auto 0;max-width:420px;color:#24090f;padding:16px 26px 18px;text-align:center;
  --notch:radial-gradient(circle at 0 50%,transparent 12px,#000 12.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 12px,#000 12.5px) right/51% 100% no-repeat;
  -webkit-mask:var(--notch);mask:var(--notch);animation:issue .55s cubic-bezier(.2,.9,.3,1.2) both}
.ticket::after{content:"";position:absolute;left:12px;right:12px;top:8px;bottom:8px;border:1.5px dashed rgba(36,9,15,.35);pointer-events:none}
.ticket .tier{font:900 34px/1 var(--display);letter-spacing:.5px}
.ticket .film{font-size:18px;margin-top:6px}
.ticket .pts{font:700 15px var(--body);margin-top:4px}
@keyframes issue{from{transform:translateY(-36px) scaleY(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ticket{animation:none}.bulb.now{animation:none}}
.bg-t0{background:var(--t0);color:#fff}.bg-t1{background:var(--t1)}.bg-t2{background:var(--t2)}.bg-t3{background:var(--t3)}.bg-t4{background:var(--t4)}.bg-t5{background:var(--t5)}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:26px}
.answers h3{margin:0 0 6px;font:700 15px var(--body);color:var(--text)}
.answers ol{margin:0;padding-left:20px;color:var(--text-dim);font-size:15px}
.answers li{margin-bottom:2px}
.count{color:var(--text-dim);font-size:14px;margin-top:16px;text-align:center}
.center{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
button.plain{font:700 16px var(--body);background:none;color:var(--text);border:2px solid var(--text-dim);padding:10px 18px;border-radius:3px;cursor:pointer}
button.plain:hover{border-color:var(--text)}

/* results */
.stubs{display:flex;justify-content:center;gap:6px;margin-top:22px}
.stub{width:34px;height:52px;border-radius:3px;-webkit-mask:radial-gradient(circle at 50% 0,transparent 6px,#000 6.5px);mask:radial-gradient(circle at 50% 0,transparent 6px,#000 6.5px)}
.recap{list-style:none;padding:0;margin:24px 0 0}
.recap li{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(251,238,232,.15);font-size:15px}
.recap .sw{width:12px;height:12px;border-radius:2px;align-self:center}
.recap .q{color:var(--text-dim)}
.recap .a{text-align:right}
.recap .a small{display:block;color:var(--text-dim)}
.stats{display:flex;justify-content:center;gap:34px;margin-top:20px;text-align:center;color:var(--text-dim);font-size:14px}
.stats b{display:block;font:900 30px/1.1 var(--display);color:var(--text)}
footer{margin-top:44px;text-align:center;font-size:13px;color:#b8918d}
footer a{color:inherit}
@media (max-width:520px){
  .board p{font-size:29px;line-height:40px;background-image:repeating-linear-gradient(to bottom,transparent 0 37px,var(--slot) 37px 39px,transparent 39px 40px)}.board{min-height:96px}
  .board.score p{font-size:64px;line-height:80px}
  .bulb{width:12px;height:12px}
  .ladder{grid-template-columns:repeat(3,1fr)}
  .answers{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="house" aria-hidden="true"></canvas>
<main>
  <div class="top">
    <div class="brand">Reel Rare</div>
    <nav class="modes" aria-label="Game mode">
      <button id="mDaily" aria-pressed="true">Daily</button>
      <button id="mUnl" aria-pressed="false">Unlimited</button>
    </nav>
  </div>
  <div id="app"><p>Loading films…</p></div>
  <footer id="foot"></footer>
</main>
<script src="data.js"></script>
<script>
/* ---------------- live background: the auditorium ---------------- */
(() => {
  const c = document.getElementById("house"), g = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, dpr, motes = [];
  // curtain state: amount open (0 closed, 1 fully open) eases toward target
  const cur = { open: 0, target: 0, color: "#ffcf4d", name: "", from: 0, t0: 0 };
  let raf = null;
  const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
  window.house = {
    open(color, name) { document.body.classList.add("lit"); Object.assign(cur, { color, name, from: cur.open, target: 1, t0: performance.now() }); kick(); },
    close() { document.body.classList.remove("lit"); if (cur.target === 0 && cur.open === 0) return; Object.assign(cur, { from: cur.open, target: 0, t0: performance.now() }); kick(); },
  };
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = c.width = Math.round(innerWidth * dpr); H = c.height = Math.round(innerHeight * dpr);
    motes = Array.from({ length: Math.round(Math.min(220, W * H / 9000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.4 + .4) * dpr,
      vx: (Math.random() - .5) * .12 * dpr, vy: (Math.random() * .1 + .03) * dpr, p: Math.random() * 6.28 }));
  }
  function inBeam(x, y, sx, sy, spread) { // inside the projector cone?
    if (y < sy) return 0;
    const half = (y - sy) * spread, d = Math.abs(x - sx);
    return d < half ? 1 - d / half : 0;
  }
  function frame(t) {
    raf = null;
    const s = t / 1000;
    // ease the curtain toward its target (instant when motion is reduced)
    const dur = cur.target ? 1100 : 750, k = still ? 1 : Math.min(1, (t - cur.t0) / dur);
    const ease = cur.target ? 1 - Math.pow(1 - k, 3) : k * k;
    cur.open = cur.from + (cur.target - cur.from) * ease;
    // velvet house with curtain folds that sway slowly
    g.fillStyle = "#22060d"; g.fillRect(0, 0, W, H);
    // the screen behind the curtain, lit in the colour of the tier you just earned
    const gap = cur.open * W / 2;
    if (gap > 1) {
      const scr = g.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, Math.max(W, H) * .7);
      scr.addColorStop(0, "#fffaf0"); scr.addColorStop(.35, cur.color); scr.addColorStop(1, "#1a0509");
      g.fillStyle = scr; g.fillRect(W / 2 - gap, 0, gap * 2, H);
      g.save(); g.beginPath(); g.rect(W / 2 - gap, 0, gap * 2, H); g.clip();
      g.fillStyle = "rgba(30,8,12,0.28)"; g.textAlign = "center"; g.textBaseline = "middle";
      const fs = Math.round(Math.min(W / 7, 150 * dpr));
      g.font = `900 ${fs}px "Big Shoulders Display", Impact, sans-serif`;
      for (let y = fs * .8; y < H + fs; y += fs * 1.05) g.fillText(cur.name.toUpperCase(), W / 2, y);
      g.restore();
    }
    const folds = 22;
    for (let i = 0; i < folds; i++) {
      const half = i < folds / 2 ? -1 : 1;              // left half slides left, right half slides right
      const w = W / folds, x = (i / folds) * W + half * gap * (1 + Math.abs(i + .5 - folds / 2) / folds * .3);
      const sway = Math.sin(s * .35 + i * .9) * w * .08 * (1 + cur.open * 2);
      if (x + w + sway < -10 || x + sway > W + 10) continue;
      const grad = g.createLinearGradient(x + sway, 0, x + w + sway, 0);
      grad.addColorStop(0, "#22060d"); grad.addColorStop(.5, "#450d1a"); grad.addColorStop(1, "#22060d");
      g.fillStyle = grad; g.fillRect(x + sway - 2, 0, w + 4, H);
    }
    // screen glow from the film that's "playing" (colour drifts like changing scenes)
    const hue = 210 + Math.sin(s * .07) * 60, glow = g.createRadialGradient(W / 2, -H * .2, 0, W / 2, -H * .2, H * .9);
    glow.addColorStop(0, `hsla(${hue},60%,70%,0.22)`); glow.addColorStop(1, "hsla(0,0%,0%,0)");
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    // projector beam with flicker
    const sx = W * .5, sy = -H * .08, spread = .55;
    const flick = .78 + .22 * Math.abs(Math.sin(s * 23.97)) * (0.7 + 0.3 * Math.sin(s * 3.1));
    const beam = g.createLinearGradient(0, sy, 0, H);
    beam.addColorStop(0, `rgba(255,241,201,${.30 * flick})`); beam.addColorStop(1, `rgba(255,241,201,${.04 * flick})`);
    g.fillStyle = beam; g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx - (H - sy) * spread, H); g.lineTo(sx + (H - sy) * spread, H); g.closePath(); g.fill();
    // dust drifting through the light
    for (const m of motes) {
      if (!still) { m.x += m.vx + Math.sin(s * .5 + m.p) * .05 * dpr; m.y -= m.vy; if (m.y < -5) { m.y = H + 5; m.x = Math.random() * W; } if (m.x < -5) m.x = W + 5; if (m.x > W + 5) m.x = -5; }
      const lit = inBeam(m.x, m.y, sx, sy, spread);
      const a = .06 + lit * .65 * flick;
      g.fillStyle = `rgba(255,241,201,${a})`; g.beginPath(); g.arc(m.x, m.y, m.r * (1 + lit * .6), 0, 6.283); g.fill();
    }
    // a row of seat backs in silhouette
    const seatW = 62 * dpr, seatH = 46 * dpr, base = H + 10 * dpr;
    g.fillStyle = "#12030a";
    for (let x = -seatW / 2; x < W + seatW; x += seatW) {
      g.beginPath(); g.roundRect(x + 4 * dpr, base - seatH, seatW - 8 * dpr, seatH + 20 * dpr, [14 * dpr, 14 * dpr, 0, 0]); g.fill();
    }
    if (!still || (k < 1)) kick();
  }
  size(); addEventListener("resize", () => { size(); kick(); });
  document.fonts && document.fonts.ready.then(kick);
  kick();
})();

/* ---------------- the game ---------------- */
(() => {
"use strict";
const D = window.REEL_DATA, app = document.getElementById("app");
if (!D) { app.innerHTML = "<p>The film list didn't load. Run <code>python3 build_data.py</code> to build data.js.</p>"; return; }

const ROUND = 7, CLUE_SECONDS = 30;
const TIER_COLORS = ["#7b5a5e", "#d8d1c3", "#7fb3e0", "#b79cf0", "#8fd19a", "#ffcf4d"];
let ticker = null;
const stopTimer = () => { clearInterval(ticker); ticker = null; };
const TIERS = [
  { name: "Missed", pts: 0, blurb: "" },
  { name: "Blockbuster", pts: 10, blurb: "Everyone's first thought" },
  { name: "Studio Film", pts: 25, blurb: "A solid pick" },
  { name: "Award Movie", pts: 50, blurb: "Off the beaten path" },
  { name: "Indie", pts: 75, blurb: "A real deep cut" },
  { name: "One in an Oscar", pts: 100, blurb: "The one hidden jackpot film for this clue" },
];
const SHARE = ["⬛", "🍿", "🎬", "🏆", "🎞️", "🌟"];
// Tier by rank among a clue's answers (0 = best known). Each cut is the smaller of a fixed rank and a
// share of the list, so big lists are generous (top 3 only are Blockbusters) and short lists still spread out.
// Everything past the last cut is Indie, except the one film per clue picked as One in an Oscar (q.o).
// These cuts must match pick_oscars() in build_data.py.
const CUTS = [[3, .15], [10, .35], [30, .60]];
const films = D.films;

document.getElementById("foot").innerHTML =
  `${films.length.toLocaleString()} films and ${D.questions.length} clues from <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>, updated ${D.built}`;

const store = {
  get(k, d) { try { const v = localStorage.getItem("reelrare:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("reelrare:" + k, JSON.stringify(v)); } catch {} },
};

/* ---- recognising a typed title (no suggestions are shown) ---- */
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/&/g, " and ").replace(/['’`]/g, "").replace(/[^a-z0-9]+/g, " ").trim().replace(/^(the|a|an) /, "");
const names = films.map((f, i) => [norm(f[0]), ...((D.aliases && D.aliases[i]) || []).map(norm)].filter(Boolean));
const byName = new Map();
names.forEach((list, i) => list.forEach(n => { const a = byName.get(n); if (a) { if (a[a.length - 1] !== i) a.push(i); } else byName.set(n, [i]); }));
// main title / subtitle of "Title: Subtitle" — only used among a clue's valid answers
const parts = films.map(f => { const m = f[0].split(/\s*[:–—]\s+|\s+-\s+/); return m.length > 1 ? m.map(norm).filter(p => p.length >= 4) : []; });

function dist(a, b, max) { // Damerau-Levenshtein with early exit
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev2 = null, prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (prev2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, prev2[j - 2] + 1);
      cur.push(v); if (v < best) best = v;
    }
    if (best > max) return max + 1;
    prev2 = prev; prev = cur;
  }
  return prev[b.length];
}
const slack = n => n.length >= 14 ? 2 : n.length >= 5 ? 1 : 0;

// → {film, ok}  ok=true: valid answer. ok=false: a real film that doesn't fit. null: unrecognised.
function resolve(text, q) {
  const n = norm(text.replace(/[\s(]*\b(19|20)\d{2}\)?\s*$/, "")) || norm(text); if (!n) return null;
  const valid = new Set(q.a);
  const exact = byName.get(n) || [];
  const hit = exact.find(i => valid.has(i));            // films are sorted most-known first
  if (hit !== undefined) return { film: hit, ok: true };
  for (const i of q.a) if (parts[i].includes(n)) return { film: i, ok: true };
  const k = slack(n);
  if (k) for (const i of q.a) if (names[i].some(m => dist(n, m, k) <= k)) return { film: i, ok: true };
  // "mission impossible" → the best-known valid film whose title starts with those words
  if (n.length >= 6) for (const i of q.a) if (names[i].some(m => m.startsWith(n + " "))) return { film: i, ok: true };
  if (exact.length) return { film: exact[0], ok: false };
  return null;
}

function tierFor(q, i) {
  const pos = q.a.indexOf(i); if (pos < 0) return 0;
  if (i === q.o) return 5;
  let rank = pos; const pop = films[i][2];
  while (rank > 0 && films[q.a[rank - 1]][2] === pop) rank--;   // ties share the better tier
  const n = q.a.length;
  for (let t = 0; t < CUTS.length; t++) if (rank < Math.max(1, Math.min(CUTS[t][0], Math.ceil(CUTS[t][1] * n)))) return t + 1;
  return 4;
}

/* ---- rounds ---- */
function rng(seed) {
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  let s = h >>> 0;
  return () => { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const byKind = {};
D.questions.forEach((q, i) => (byKind[q.kind] ||= []).push(i));
function makeRound(rand, avoid = new Set()) {
  if (D.slots) {
    const picks = [];
    const open = i => !picks.includes(i) && !avoid.has(i);
    for (const slot of D.slots) {
      const kinds = slot.filter(k => (byKind[k] || []).some(open));
      // this slot's categories are used up: take any unseen clue; only repeat when none are left
      const pool = kinds.length ? byKind[kinds[Math.floor(rand() * kinds.length)]].filter(open)
        : D.questions.map((_, i) => i).filter(open).length ? D.questions.map((_, i) => i).filter(open)
        : D.questions.map((_, i) => i).filter(i => !picks.includes(i));
      picks.push(pool[Math.floor(rand() * pool.length)]);
    }
    for (let i = picks.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [picks[i], picks[j]] = [picks[j], picks[i]]; }
    if (picks.length === ROUND) return picks;
  }
  const kinds = Object.keys(byKind).sort();
  for (let i = kinds.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
  const picks = [];
  for (const k of kinds) if (picks.length < ROUND) picks.push(byKind[k][Math.floor(rand() * byKind[k].length)]);
  while (picks.length < ROUND) { const i = Math.floor(rand() * D.questions.length); if (!picks.includes(i)) picks.push(i); }
  return picks;
}
// Daily clues come from the schedule the build script fixes in advance; fall back to a seeded pick.
function dailyClues(day) {
  const ks = D.daily && D.daily[day];
  const qs = ks ? ks.map(k => qByKey.get(k)) : null;
  return qs && qs.length && qs.every(i => i !== undefined) ? qs : makeRound(rng("reelrare-" + day));
}
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const niceDay = iso => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { month: "long", day: "numeric" });

let mode = "daily", G = null;
function start(m) {
  mode = m; stopTimer();
  document.getElementById("mDaily").setAttribute("aria-pressed", m === "daily");
  document.getElementById("mUnl").setAttribute("aria-pressed", m === "unlimited");
  if (m === "daily") {
    const day = today();
    G = loadDaily(day) || { day, qs: dailyClues(day), i: 0, answers: [], wrong: [], deadline: null, done: false };
  } else {
    // Unlimited never repeats a clue until you've seen them all, and skips today's daily clues
    let seen = new Set(store.get("seen", []).map(k => qByKey.get(k)).filter(i => i !== undefined));
    const todays = new Set(dailyClues(today()));
    let avoid = new Set([...seen, ...todays]);
    if (D.questions.length - avoid.size < ROUND) { seen = new Set(); avoid = todays; }
    const qs = makeRound(Math.random, avoid);
    store.set("seen", [...seen, ...qs].map(i => D.questions[i].key));
    G = { qs, i: 0, answers: [], wrong: [], deadline: null, done: false };
  }
  render();
}
// Saved progress uses stable ids (question key, "title|year"), not array positions,
// because positions change whenever the film data is rebuilt.
const filmId = i => films[i][0] + "|" + films[i][1];
const qByKey = new Map(D.questions.map((q, i) => [q.key, i]));
let filmById = null;
function loadDaily(day) {
  const s = store.get("daily2:" + day, null);
  if (!s) return null;
  const qs = s.keys.map(k => qByKey.get(k));
  if (qs.some(i => i === undefined)) return null;
  filmById ||= new Map(films.map((f, i) => [f[0] + "|" + f[1], i]).reverse());
  const answers = s.answers.map(a => ({ f: a.id == null ? null : filmById.get(a.id) ?? null, t: a.t, timeout: !!a.timeout }));
  return { day, qs, i: s.i, answers, done: s.done, reveal: s.reveal, deadline: s.deadline || null,
    wrong: (s.wrong || []).map(id => filmById.get(id)).filter(i => i !== undefined) };
}
const save = () => {
  if (mode !== "daily") return;
  store.set("daily2:" + G.day, { keys: G.qs.map(i => D.questions[i].key), i: G.i, done: G.done, reveal: G.reveal,
    deadline: G.deadline, wrong: G.wrong.map(filmId),
    answers: G.answers.map(a => ({ id: a.f == null ? null : filmId(a.f), t: a.t, timeout: !!a.timeout })) });
};
const total = () => G.answers.reduce((s, a) => s + TIERS[a.t].pts, 0);
function record(film, t, timeout = false) {
  stopTimer();
  G.answers.push({ f: film, t, timeout }); G.wrong = []; G.deadline = null; G.reveal = true; save(); render();
}
function next() {
  G.reveal = false; G.i++;
  if (G.i >= ROUND) {
    G.done = true;
    if (mode === "unlimited") { const st = store.get("unl", { played: 0, best: 0, total: 0 }); st.played++; st.total += total(); st.best = Math.max(st.best, total()); store.set("unl", st); }
  }
  save(); render();
}

/* ---- rendering ---- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const title = i => `${esc(films[i][0])} (${films[i][1]})`;
function marquee(text, cls = "") {
  const bulbs = Array.from({ length: ROUND }, (_, k) => {
    const a = G.answers[k];
    return `<span class="bulb ${a ? "t" + a.t : k === G.i && !G.done ? "now" : ""}"></span>`;
  }).join("");
  return `<div class="marquee"><div class="bulbs" aria-hidden="true">${bulbs}</div><div class="board ${cls}"><p>${esc(text)}</p></div></div>`;
}
const caption = () => `<div class="caption"><span>${mode === "daily" ? "Daily for " + niceDay(G.day) : "Unlimited"}</span><span>Clue ${Math.min(G.i + 1, ROUND)} of ${ROUND}</span></div>`;
const ladder = () => `<ul class="ladder">${[1, 2, 3, 4, 5].map(t => `<li style="border-color:var(--t${t})"><b>${TIERS[t].name}</b>${TIERS[t].pts} points</li>`).join("")}</ul>`;

function render() {
  if (G.done) return renderEnd();
  const q = D.questions[G.qs[G.i]];
  if (G.reveal) return renderReveal(q);
  window.house && house.close();
  if (!G.deadline) { G.deadline = Date.now() + CLUE_SECONDS * 1000; save(); }
  app.innerHTML = marquee(q.text) + `<div class="timer" aria-hidden="true"><span id="bar"></span></div>` + caption() + `
    <form id="f" autocomplete="off">
      <label class="vh" for="in">Your answer</label>
      <div class="entry"><input id="in" type="text" placeholder="Type a film title" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go"><button class="go" type="submit">Guess</button></div>
      <div class="status"><span id="clock" role="timer"></span><button type="button" class="linkish" id="skip">Give up on this one</button></div>
      <div class="note" id="note" role="status"></div>
      <p class="tried" id="tried"></p>
    </form>` + ladder();
  const inp = document.getElementById("in"), note = document.getElementById("note");
  const bar = document.getElementById("bar"), clock = document.getElementById("clock"), tried = document.getElementById("tried");
  const showTried = () => { tried.textContent = G.wrong.length ? "Not it: " + G.wrong.map(i => films[i][0]).join(", ") : ""; };
  showTried();
  const tick = () => {
    const left = Math.max(0, G.deadline - Date.now());
    bar.style.transform = `scaleX(${left / (CLUE_SECONDS * 1000)})`;
    bar.classList.toggle("low", left < 10000);
    clock.textContent = `${Math.ceil(left / 1000)} seconds left`;
    if (left <= 0) record(null, 0, true);
  };
  stopTimer(); tick();
  if (G.reveal) return;   // time had already run out (e.g. page reopened later): the miss is shown
  ticker = setInterval(tick, 200);
  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const text = inp.value.trim(); if (!text) return;
    const r = resolve(text, q);
    if (!r) { note.textContent = `No film called "${text}" in our list. Check the spelling.`; inp.select(); return; }
    if (r.ok) return record(r.film, tierFor(q, r.film));
    if (!G.wrong.includes(r.film)) G.wrong.push(r.film);
    save(); showTried();
    note.textContent = `${films[r.film][0]} (${films[r.film][1]}) doesn't fit. Keep guessing.`;
    inp.value = ""; inp.focus();
  });
  document.getElementById("skip").addEventListener("click", () => record(null, 0));
  inp.focus({ preventScroll: true });
}

function renderReveal(q) {
  const a = G.answers[G.i], T = TIERS[a.t];
  const film = a.timeout ? "Time ran out" : a.f == null ? "You gave up on this one" : title(a.f);
  if (window.house) a.t ? house.open(TIER_COLORS[a.t], T.name) : house.close();
  app.innerHTML = marquee(q.text) + caption() + `
    <div class="ticket bg-t${a.t}" role="status">
      <div class="tier">${T.name}</div>
      <div class="film">${film}</div>
      <div class="pts">${a.t ? `${T.blurb}. +${T.pts} points` : "0 points"}</div>
    </div>
    <div class="answers">
      <div><h3>Most people say</h3><ol>${q.a.slice(0, 5).map(i => `<li>${title(i)}</li>`).join("")}</ol></div>
      <div><h3>Hardly anyone says</h3><ol>${q.a.slice(-5).reverse().map(i => `<li>${title(i)}</li>`).join("")}</ol></div>
    </div>
    <p class="count">${a.t === 5 ? "You found it" : `The One in an Oscar film was ${title(q.o)}`}. ${q.a.length} films fit this clue.</p>
    <div class="center"><button class="go" id="nx" style="padding:10px 26px">${G.i + 1 < ROUND ? "Next clue" : "See my score"}</button></div>`;
  const nx = document.getElementById("nx"); nx.addEventListener("click", next); nx.focus({ preventScroll: true });
}

function shareText() {
  return `Reel Rare ${mode === "daily" ? niceDay(G.day) : "(unlimited)"}\n${G.answers.map(a => SHARE[a.t]).join("")}\n${total()} points`;
}
function renderEnd() {
  window.house && house.close();
  const st = store.get("unl", { played: 0, best: 0, total: 0 });
  app.innerHTML = marquee(total() + " pts", "score") + `
    <div class="caption"><span>${mode === "daily" ? "Daily for " + niceDay(G.day) : "Unlimited round"}</span><span>Out of ${ROUND * 100}</span></div>
    <div class="stubs" aria-hidden="true">${G.answers.map(a => `<span class="stub bg-t${a.t}"></span>`).join("")}</div>
    <ul class="recap">${G.answers.map((a, k) => `<li><span class="sw bg-t${a.t}"></span><span class="q">${esc(D.questions[G.qs[k]].text)}</span>
      <span class="a">${a.timeout ? "Time ran out" : a.f == null ? "No answer" : title(a.f)}<small>${TIERS[a.t].name}${a.t ? ", " + TIERS[a.t].pts : ""}</small></span></li>`).join("")}</ul>
    ${mode === "unlimited"
      ? `<div class="stats"><span><b>${st.played}</b>rounds played</span><span><b>${st.best}</b>best score</span><span><b>${st.played ? Math.round(st.total / st.played) : 0}</b>average</span></div>`
      : `<p class="count">A new set of seven clues arrives at midnight.</p>`}
    <div class="center"><button class="plain" id="cp">Copy my results</button><button class="go" id="again" style="padding:10px 26px">${mode === "unlimited" ? "Play another round" : "Play Unlimited"}</button></div>`;
  document.getElementById("cp").addEventListener("click", async e => {
    try { await navigator.clipboard.writeText(shareText()); e.target.textContent = "Copied"; } catch { e.target.textContent = "Couldn't copy"; }
  });
  document.getElementById("again").addEventListener("click", () => start("unlimited"));
}

document.getElementById("mDaily").addEventListener("click", () => start("daily"));
document.getElementById("mUnl").addEventListener("click", () => start("unlimited"));
start("daily");
})();
</script>
</body>
</html>
